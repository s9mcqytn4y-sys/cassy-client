<span class="w-3.5 h-3.5 rounded-full bg-surface-container-highest transition-all"></span>
<span class="w-3.5 h-3.5 rounded-full bg-surface-container-highest transition-all"></span>

</div>
<div class="bg-tertiary-fixed text-on-tertiary-fixed-variant px-3 py-1 rounded-lg flex items-center justify-center gap-1.5">

<button class="min-h-[52px] rounded-xl bg-surface-container-low active:bg-surface-container-high text-on-surface font-headline-sm text-headline-sm flex items-center justify-center transition-colors" onclick="pressKey('2')" type="button">2</button>
<button class="min-h-[52px] rounded-xl bg-surface-container-low active:bg-surface-container-high text-on-surface font-headline-sm text-headline-sm flex items-center justify-center transition-colors" onclick="pressKey('3')" type="button">3</button>
<button class="min-h-[52px] rounded-xl bg-surface-container-low active:bg-surface-container-high text-on-surface font-headline-sm text-headline-sm flex items-center justify-center transition-colors" onclick="pressKey('4')" type="button">4</button>
<button class="min-h-[52px] rounded-xl bg-surface-container-low active:bg-surface-container-high text-on-surface font-headline-sm text-headline-sm flex items-center justify-center transition-colors" onclick="pressKey('5')" type="button">5</button>
<button class="min-h-[52px] rounded-xl bg-surface-container-low active:bg-surface-container-high text-on-surface font-headline-sm text-headline-sm flex items-center justify-center transition-colors" onclick="pressKey('6')" type="button">6</button>
<button class="min-h-[52px] rounded-xl bg-surface-container-low active:bg-surface-container-high text-on-surface font-headline-sm text-headline-sm flex items-center justify-center transition-colors" onclick="pressKey('7')" type="button">7</button>
<button class="min-h-[52px] rounded-xl bg-surface-container-low active:bg-surface-container-high text-on-surface font-headline-sm text-headline-sm flex items-center justify-center transition-colors" onclick="pressKey('8')" type="button">8</button>

</div>
<div class="flex flex-col items-start min-w-0">
<span class="font-title-md text-title-md text-on-surface truncate">Pindai QR Pairing</span>
<span class="font-label-md text-label-md text-on-surface-variant truncate">Gunakan HID Scanner</span>
</div>
</div>
<span class="material-symbols-outlined text-secondary text-[22px] shrink-0">chevron_right</span>
</button>
</div>
</div>
<script>
  let pin = '';
  const maxPin = 6;
  const dots = document.querySelectorAll('#pin-dots span');

  function updateDots() {
    dots.forEach((dot, idx) => {
      if (idx < pin.length) {
        dot.classList.remove('bg-surface-container-highest');
        dot.classList.add('bg-primary', 'scale-110');
      } else {
        dot.classList.add('bg-surface-container-highest');
        dot.classList.remove('bg-primary', 'scale-110');
      }
    });
  }

  function pressKey(num) {
    if (pin.length < maxPin) {
      pin += num;
      updateDots();
    }
  }

  function deleteKey() {
    if (pin.length > 0) {
      pin = pin.slice(0, -1);
      updateDots();
    }
  }

  function submitPin() {
    if (pin.length === maxPin) {
      pin = '';
      updateDots();
    }
  }

  function switchMode(mode) {
    const tabQr = document.getElementById('tab-qr');
    const tabStaff = document.getElementById('tab-staff');
    const viewQr = document.getElementById('view-qr');
    const viewStaff = document.getElementById('view-staff');

    if (mode === 'qr') {
      tabQr.classList.add('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
      tabQr.classList.remove('text-on-surface-variant');
      tabStaff.classList.remove('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
      tabStaff.classList.add('text-on-surface-variant');
      viewQr.classList.remove('hidden');
      viewStaff.classList.add('hidden');
    } else {
      tabStaff.classList.add('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
      tabStaff.classList.remove('text-on-surface-variant');
      tabQr.classList.remove('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
      tabQr.classList.add('text-on-surface-variant');
      viewStaff.classList.remove('hidden');
      viewQr.classList.add('hidden');
    }
  }
</script></main></body></html>
