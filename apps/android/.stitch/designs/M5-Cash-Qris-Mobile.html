<script>
  (() => {
    const TOTAL_BILL = 35200;
    let currentInput = 50000;

    const displayInput = document.getElementById('cash-input-display');
    const displayChange = document.getElementById('change-display');
    const btnSubmit = document.getElementById('btn-submit-cash');
    const clearBtn = document.getElementById('btn-clear-all');

    function formatRupiah(num) {
      return 'Rp ' + Number(num).toLocaleString('id-ID');
    }

    function updateViews() {
      displayInput.textContent = formatRupiah(currentInput);
      const diff = currentInput - TOTAL_BILL;
      if (diff >= 0) {
        displayChange.textContent = formatRupiah(diff);
        displayChange.classList.remove('text-error');
        displayChange.classList.add('text-primary');
        btnSubmit.disabled = false;
        btnSubmit.classList.remove('opacity-50', 'pointer-events-none');
      } else {
        displayChange.textContent = 'Kurang ' + formatRupiah(Math.abs(diff));
        displayChange.classList.remove('text-primary');
        displayChange.classList.add('text-error');
        btnSubmit.disabled = true;
        btnSubmit.classList.add('opacity-50', 'pointer-events-none');
      }
    }

    document.querySelectorAll('.keypad-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.getAttribute('data-key');
        let strVal = currentInput === 0 ? '' : String(currentInput);

        if (key === 'backspace') {
          strVal = strVal.slice(0, -1);
          currentInput = strVal.length > 0 ? parseInt(strVal, 10) : 0;
        } else if (key === '000') {
          if (strVal.length > 0 && strVal.length <= 6) {
            strVal += '000';
            currentInput = parseInt(strVal, 10);
          }
        } else {
          if (strVal.length <= 8) {
            strVal += key;
            currentInput = parseInt(strVal, 10);
          }
        }
        updateViews();
      });
    });

    document.querySelectorAll('.btn-quick-denom').forEach(btn => {
      btn.addEventListener('click', () => {
        const val = parseInt(btn.getAttribute('data-val'), 10);
        currentInput = val;
        updateViews();
      });
    });

    if (clearBtn) {
      clearBtn.addEventListener('click', () => {
        currentInput = 0;
        updateViews();
      });
    }

    updateViews();
  })();
</script></main></body></html>
