<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" fill="none" role="img" aria-label="Sistem sedang pemeliharaan singkat">
  <style>
    @keyframes cassySteam {
      0%, 100% { transform: translateY(0px); opacity: 0.45; }
      50% { transform: translateY(-5px); opacity: 0.9; }
    }
    .cassy-steam { animation: cassySteam 3.2s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
    @media (prefers-reduced-motion: reduce) {
      .cassy-steam { animation: none; opacity: 0.7; }
    }
  </style>
  <ellipse cx="100" cy="134" rx="56" ry="7" fill="#17211E" fill-opacity="0.08"/>
  <!-- Steam waves -->
  <g class="cassy-steam" stroke="#E9A23B" stroke-width="2.4" stroke-linecap="round">
    <path d="M88 38C88 33 93 31 93 26"/>
    <path d="M100 34C100 29 105 27 105 22"/>
    <path d="M112 38C112 33 117 31 117 26"/>
  </g>
  <!-- Pour-over Kettle Body -->
  <path d="M68 62H132L126 118C125.4 123 121.2 126 116.2 126H83.8C78.8 126 74.6 123 74 118L68 62Z" fill="#FFFFFF" stroke="#1F5F52" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Lid -->
  <path d="M64 62H136" stroke="#1F5F52" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="92" y="52" width="16" height="10" rx="4" fill="#1F5F52"/>
  <!-- Gooseneck Spout -->
  <path d="M69 96C55 96 52 76 42 66" stroke="#1F5F52" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Handle -->
  <path d="M131 70H143C149 70 153 75 153 81V98C153 104 149 109 143 109H128" stroke="#1F5F52" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Calibrated Status Dial -->
  <circle cx="100" cy="94" r="15" fill="#E9A23B" fill-opacity="0.2" stroke="#E9A23B" stroke-width="2.2"/>
  <path d="M100 86V94L105 97" stroke="#17211E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
