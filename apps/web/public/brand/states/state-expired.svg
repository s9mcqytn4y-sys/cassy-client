<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" fill="none" role="img" aria-label="Batas waktu pembayaran berakhir">
  <style>
    @keyframes cassyTick {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(8deg); }
    }
    .cassy-tick { transform-origin: 100px 76px; animation: cassyTick 3.5s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
    @media (prefers-reduced-motion: reduce) {
      .cassy-tick { animation: none; }
    }
  </style>
  <ellipse cx="100" cy="134" rx="50" ry="7" fill="#17211E" fill-opacity="0.08"/>
  <!-- Outer Timer Ring -->
  <circle cx="100" cy="76" r="44" fill="#FFFFFF" stroke="#1F5F52" stroke-width="2.5"/>
  <circle cx="100" cy="76" r="35" stroke="#E2DDD2" stroke-width="2" stroke-dasharray="5 5"/>
  <!-- Top Crown -->
  <path d="M90 24H110" stroke="#1F5F52" stroke-width="3" stroke-linecap="round"/>
  <path d="M100 24V32" stroke="#1F5F52" stroke-width="3" stroke-linecap="round"/>
  <!-- Clock Hands -->
  <g class="cassy-tick">
    <path d="M100 76V54" stroke="#17211E" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M100 76L116 85" stroke="#E9A23B" stroke-width="2.8" stroke-linecap="round"/>
    <circle cx="100" cy="76" r="4" fill="#1F5F52"/>
  </g>
  <!-- 15m Badge -->
  <rect x="116" y="96" width="40" height="22" rx="11" fill="#E9A23B"/>
  <text x="136" y="111" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#17211E">15m</text>
</svg>
