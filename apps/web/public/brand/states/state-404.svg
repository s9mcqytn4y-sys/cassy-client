<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" fill="none" role="img" aria-label="Meja atau halaman tidak ditemukan">
  <style>
    @keyframes cassyFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .cassy-float { animation: cassyFloat 4s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
    @media (prefers-reduced-motion: reduce) {
      .cassy-float { animation: none; }
    }
  </style>
  <!-- Transparent background: soft elliptical shadow only -->
  <ellipse cx="100" cy="134" rx="54" ry="7" fill="#17211E" fill-opacity="0.08"/>
  <g class="cassy-float">
    <!-- Acrylic Table Tent Stand -->
    <path d="M58 124L72 34C73 28 78 24 84 24H116C122 24 127 28 128 34L142 124H58Z" fill="#FFFFFF" stroke="#1F5F52" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Broken QR Frame -->
    <rect x="80" y="44" width="16" height="16" rx="3" stroke="#1F5F52" stroke-width="2.5"/>
    <rect x="85" y="49" width="6" height="6" rx="1" fill="#1F5F52"/>
    <rect x="104" y="44" width="16" height="16" rx="3" stroke="#1F5F52" stroke-width="2.5"/>
    <rect x="109" y="49" width="6" height="6" rx="1" fill="#1F5F52"/>
    <rect x="80" y="68" width="16" height="16" rx="3" stroke="#1F5F52" stroke-width="2.5"/>
    <rect x="85" y="73" width="6" height="6" rx="1" fill="#1F5F52"/>
    <!-- Kunyit Question Badge -->
    <circle cx="114" cy="78" r="14" fill="#E9A23B"/>
    <path d="M110.5 74.5C110.5 72.3 112.1 71 114.2 71C116.2 71 117.7 72.2 117.7 74C117.7 75.5 116.8 76.4 115.5 77.2C114.5 77.8 114.1 78.4 114.1 79.6V80.2" stroke="#17211E" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="114.1" cy="84" r="1.4" fill="#17211E"/>
    <!-- Table Base Line -->
    <path d="M74 106H126" stroke="#E2DDD2" stroke-width="2" stroke-linecap="round"/>
    <rect x="84" y="112" width="32" height="5" rx="2.5" fill="#1F5F52" fill-opacity="0.18"/>
  </g>
</svg>
