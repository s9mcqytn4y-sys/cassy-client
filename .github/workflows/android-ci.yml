name: Android POS CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "docs/**", "chore/**"]
    paths:
      - "apps/android/**"
      - "packages/design-tokens/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required checks must always report on a PR, so the workflow runs on every PR and this job
  # decides whether the heavy jobs below run; a skipped job counts as passed (S2-Q6).
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "origin/$BASE...HEAD" | grep -qE '^(apps/android/|packages/design-tokens/|\.github/workflows/android-ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    needs: [changes]
    if: needs.changes.outputs.run == 'true'
    name: Build, Lint & Unit Tests (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: No cancellation-swallowing runCatching in I/O layers (TD-06)
        working-directory: .
        run: |
          # runCatching inside suspend code also catches CancellationException; use runCatchingCancellable.
          if grep -rn "runCatching {" apps/android/app/src/main/java/com/azuredevid/cassy/core/hardware apps/android/app/src/main/java/com/azuredevid/cassy/data/repository; then
            echo "Use runCatchingCancellable in core/hardware and data/repository." >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v6

      - name: Run Unit Tests & Debug Bundle
        run: |
          chmod +x gradlew
          ./gradlew testDevDebugUnitTest bundleDevDebug --max-workers=2 --no-daemon --stacktrace

      - name: Decode Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > upload-keystore.jks
          fi

      - name: Run Lint & R8 Prod Release Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew lintDevDebug bundleProdRelease --max-workers=1 --no-daemon --stacktrace
