name: Android POS CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "docs/**", "chore/**"]
    paths:
      - "apps/android/**"
      - "packages/design-tokens/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/android/**"
      - "packages/design-tokens/**"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Lint & Unit Tests (JDK 17)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests & Debug Bundle
        run: |
          chmod +x gradlew
          ./gradlew testDevDebugUnitTest bundleDevDebug --max-workers=2 --no-daemon --stacktrace

      - name: Run Lint & R8 Prod Release Bundle
        run: ./gradlew lintDevDebug bundleProdRelease --max-workers=1 --no-daemon --stacktrace
