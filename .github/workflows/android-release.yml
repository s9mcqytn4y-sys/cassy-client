name: Android POS Release

# Play release bundle (FL1 W3). A v* tag builds the prod AAB with versionName from the tag and
# versionCode from the run number. Signed only when the upload-key secrets exist; otherwise the
# bundle is unsigned and only good for inspection. No Play upload here (waits on the D-U-N-S).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName for a test build (no tag)"
        required: true
        default: "0.0.0-test"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Prod Release Bundle (AAB + R8 mapping)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_NAME: ${{ inputs.version_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then name="${REF_NAME#v}"; else name="$INPUT_NAME"; fi
          if ! printf '%s' "$name" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "versionName '$name' is not semver" >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Decode upload key (only when secrets exist)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > upload-keystore.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build prod release bundle
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleProdRelease --max-workers=2 --no-daemon --stacktrace

      - name: Remove decoded upload key
        if: always()
        run: rm -f upload-keystore.jks

      - name: Summary
        env:
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ github.run_number }}
          SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          {
            echo "### Cassy POS prod AAB"
            echo "- versionName: \`$NAME\`"
            echo "- versionCode: \`$CODE\`"
            echo "- signed with upload key: \`$SIGNED\`"
            ls -l app/build/outputs/bundle/prodRelease/ | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: cassy-pos-${{ steps.version.outputs.name }}-${{ github.run_number }}-aab
          path: apps/android/app/build/outputs/bundle/prodRelease/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: cassy-pos-${{ steps.version.outputs.name }}-${{ github.run_number }}-mapping
          path: apps/android/app/build/outputs/mapping/prodRelease/mapping.txt
          if-no-files-found: error
          retention-days: 90
