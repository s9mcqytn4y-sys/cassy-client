name: Android UI Screenshots & Instrumentation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # 01:00 WIB; advisory, not a required check (S2-Q6)

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-emulator-screenshots:
    name: Tablet & Mobile Emulator UI Tests & Screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Enable KVM permissions if present
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules || true
            sudo udevadm trigger --name-match=kvm || true
            sudo chmod 666 /dev/kvm
            echo "KVM enabled:"
            ls -la /dev/kvm
          else
            echo "KVM not available"
          fi

      - name: Build devDebug and androidTest APKs
        run: |
          cd apps/android
          chmod +x gradlew
          ./gradlew assembleDevDebug assembleDevDebugAndroidTest --max-workers=2 --no-daemon --stacktrace

      - name: Run Tablet & Mobile Emulator Live Pairing Flow & CassyUiShowcaseTest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          avd-name: cassy_ci_tablet
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back virtualscene
          script: bash .github/scripts/RunAndroidUiScreenshots.sh

      - name: Upload UI Screenshot Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-ui-v2.5.0-screenshots
          path: artifacts/ui-v2.5.0/
          if-no-files-found: warn
