name: Android Live E2E (Docker test stack)

# Emulator instrumentation against the real backend (GHCR cassy-api), Toxiproxy and the
# virtual ESC/POS printer from cassy-docker Core/DockerComposeTest.yml. Sprint S0 of
# Docs/PRD/PrdOpsAndPwaClose.md; later sprints add lifecycle tests under androidTest/.../live.

on:
  workflow_dispatch:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
    paths:
      - "apps/android/**"
      - ".github/workflows/android-live-e2e.yml"
      - ".github/scripts/StartCassyTestStack.sh"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required checks must always report on a PR, so the workflow runs on every PR and this job
  # decides whether the heavy jobs below run; a skipped job counts as passed (S2-Q6).
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "origin/$BASE...HEAD" | grep -qE '^(apps/android/|\.github/workflows/android-live-e2e\.yml|\.github/scripts/StartCassyTestStack\.sh)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  android-live-e2e:
    needs: [changes]
    if: needs.changes.outputs.run == 'true'
    name: Emulator vs Docker Test Stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Docker test stack
        run: bash .github/scripts/StartCassyTestStack.sh

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build devDebug and androidTest APKs
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDevDebug assembleDevDebugAndroidTest --max-workers=2 --no-daemon --stacktrace

      - name: Run live instrumentation on tablet emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          avd-name: cassy_ci_live
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim
          script: |
            adb install -r apps/android/app/build/outputs/apk/dev/debug/app-dev-debug.apk
            adb install -r apps/android/app/build/outputs/apk/androidTest/dev/debug/app-dev-debug-androidTest.apk
            bash .github/scripts/RunLiveInstrumentation.sh

      - name: Upload printer jobs and stack logs
        if: always()
        run: |
          mkdir -p artifacts
          curl -fsS http://127.0.0.1:9101/jobs > artifacts/PrinterJobs.json || true
          docker compose -p cassy-test logs --no-color > artifacts/StackLogs.txt 2>&1 || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-live-e2e
          path: |
            artifacts/
            instrument*.log
          retention-days: 14
