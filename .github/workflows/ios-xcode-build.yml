name: iOS POS Swift Package & Xcode Verify

on:
  workflow_dispatch:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
    paths:
      - "apps/ios/**"
      - "packages/design-tokens/**"
      - ".github/workflows/ios-xcode-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/ios/**"
      - "packages/design-tokens/**"
      - ".github/workflows/ios-xcode-build.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PRODUCT_BUNDLE_IDENTIFIER: com.azuredevid.cassy

jobs:
  ios-xcode-verify:
    name: Build & Verify Swift Package on macOS-15 Xcode (com.azuredevid.cassy)
    runs-on: macos-15
    steps:
      - name: Checkout client monorepo
        uses: actions/checkout@v7

      - name: Select latest stable Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build CassyPOS Swift Package for iOS Simulator
        working-directory: apps/ios
        run: |
          xcodebuild -scheme CassyPOS -destination 'generic/platform=iOS Simulator' -configuration Debug build CODE_SIGNING_ALLOWED=NO
