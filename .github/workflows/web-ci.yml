name: Web CI & Quality Gates

on:
  push:
    branches: [main, "docs/**", "feat/**", "fix/**", "chore/**"]
    paths:
      - "apps/web/**"
      - "packages/design-tokens/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web-ci.yml"
      - ".github/scripts/StartCassyTestStack.sh"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required checks must always report on a PR, so the workflow runs on every PR and this job
  # decides whether the heavy jobs below run; a skipped job counts as passed (S2-Q6).
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "origin/$BASE...HEAD" | grep -qE '^(apps/web/|packages/design-tokens/|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.github/workflows/web-ci\.yml|\.github/scripts/StartCassyTestStack\.sh)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.24.3
          curl -sSLf "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          curl -sSLf "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o /tmp/gitleaks_checksums.txt
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" /tmp/gitleaks_checksums.txt | sed "s/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz/\/tmp\/gitleaks.tar.gz/" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --verbose

  web-verify-and-build:
    needs: [changes]
    if: needs.changes.outputs.run == 'true'
    name: Web Lint, Typecheck, Tokens & Standalone Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Design Tokens & A11y Contrast
        run: pnpm run tokens:verify

      - name: Typecheck TypeScript
        run: pnpm run typecheck

      - name: No hardcoded UI copy (PWA-10)
        run: pnpm --filter @azuredevid/cassy-web check:copy

      - name: Unit tests
        run: pnpm --filter @azuredevid/cassy-web test:unit

      - name: Build Next.js Web App
        run: pnpm run build

  web-e2e:
    name: Web E2E (Chromium, WebKit, axe, keyboard, reflow)
    runs-on: ubuntu-latest
    needs: [web-verify-and-build]
    timeout-minutes: 15
    # Browsers and their system libraries ship in the image; installing them with apt took about 25 minutes.
    # Keep the tag equal to the playwright version in pnpm-lock.yaml.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js Web App
        run: pnpm run build

      - name: Run Playwright against the production build
        env:
          PLAYWRIGHT_CAPTURE_EVIDENCE: "1"
        run: pnpm --filter @azuredevid/cassy-web test:e2e

      - name: Upload Playwright UI v2.5.0 Evidence Screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-ui-screenshots-v2.5.0
          path: apps/web/screenshots/ui-v2.5.0
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7

  web-e2e-live:
    name: Web Live E2E (Docker test stack)
    runs-on: ubuntu-latest
    needs: [web-verify-and-build]
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Docker test stack
        run: bash .github/scripts/StartCassyTestStack.sh

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build against the test stack (rewrites are baked at build time)
        env:
          BACKEND_INTERNAL_URL: http://127.0.0.1:18080
        run: pnpm run build

      - name: Install Chromium
        run: pnpm --filter @azuredevid/cassy-web exec playwright install --with-deps chromium

      - name: Run live Playwright
        run: pnpm --filter @azuredevid/cassy-web test:e2e:live

      - name: Upload stack logs and traces on failure
        if: failure()
        run: docker compose -p cassy-test logs --no-color > apps/web/test-results/StackLogs.txt 2>&1 || true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: web-e2e-live-results
          path: apps/web/test-results
          retention-days: 7

  web-docker-build:
    name: Docker Build Validation (apps/web)
    runs-on: ubuntu-latest
    needs: [web-verify-and-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Web Docker Image (validation only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: cassy-web:test

